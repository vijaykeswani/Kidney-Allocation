<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}Organ Allocation Preference Study{% endblock %}</title>
<style>
:root{
  --bg:#ffffff; --surface:#f8fafc; --surface-alt:#f1f5f9;
  --border:#e2e8f0; --border-strong:#cbd5e1;
  --text:#0f172a; --text-secondary:#475569; --text-muted:#94a3b8;
  --accent:#2563eb; --accent-hover:#1d4ed8; --accent-soft:#eff6ff;
  --a:#0f766e; --a-soft:#d8ecea; --b:#b1622f; --b-soft:#f6e7dd;   /* model-viewing stages: A teal, B orange (test_palette.py guards these) */
  --neutral:#334155; --neutral-soft:#f1f5f9;                       /* preference-elicitation stage: neither patient is colour-coded */
  --success:#15803d; --success-soft:#f0fdf4;
  --warning:#b45309; --warning-soft:#fffbeb;
  /* Aliases so twostage.html, which uses the tree editor's token names,
     resolves to the same colors as every other page. */
  --patient-a: var(--a); --patient-a-soft: var(--a-soft);
  --patient-b: var(--b); --patient-b-soft: var(--b-soft);
  --text-primary: var(--text);
}
*{box-sizing:border-box;}

/* (i) icon: hover, focus or tap shows what a factor means and how it is scaled */
.info{display:inline-flex; align-items:center; justify-content:center; width:16px; height:16px;
  border-radius:50%; border:1px solid var(--border-strong); background:#fff; color:var(--text-muted);
  font-size:11px; font-weight:700; font-style:normal; font-family:Georgia,serif; line-height:1;
  cursor:help; margin-left:6px; position:relative; vertical-align:middle;
  text-transform:none; letter-spacing:0;}
.info:hover,.info:focus{color:var(--accent); border-color:var(--accent); outline:none;}
.info::after{content:attr(data-tip); position:absolute; left:50%; bottom:calc(100% + 8px);
  transform:translateX(-50%); width:max-content; max-width:260px; background:#0f172a; color:#fff;
  font-family:-apple-system,"Segoe UI",Roboto,sans-serif; font-size:12.5px; font-weight:400; line-height:1.45;
  padding:8px 10px; border-radius:8px; opacity:0; pointer-events:none; transition:opacity .12s;
  z-index:300; white-space:normal; text-align:left;}
.info:hover::after,.info:focus::after{opacity:1;}
html,body{background:var(--bg); color:var(--text); margin:0;
  font-family:-apple-system,"Segoe UI",Roboto,sans-serif; font-size:16px;}
.wrap{max-width:900px; margin:0 auto; padding:36px 40px 48px;}
h1{font-size:2rem; font-weight:700; line-height:1.2; letter-spacing:-0.01em; margin:0 0 8px;}
h2{font-size:1.5rem; font-weight:600; line-height:1.3; letter-spacing:-0.01em; margin:0 0 8px;}
h3{font-size:1.25rem; font-weight:600; line-height:1.4; margin:0 0 8px;}
p, li{font-size:16px; line-height:1.7;}
strong{color:var(--text);}
hr{border:none; border-top:1px solid var(--border); margin:1.5rem 0;}
.eyebrow{font-size:13px; color:var(--text-muted); text-transform:uppercase;
  letter-spacing:.08em; font-weight:600;}
.muted{color:var(--text-secondary);}
.content-card{background:var(--surface); border:1px solid var(--border);
  border-radius:12px; padding:18px 20px;}
.spacer-14{height:14px;} .spacer-16{height:16px;} .spacer-20{height:20px;}
.spacer-24{height:24px;} .spacer-28{height:28px;} .spacer-32{height:32px;}

/* Buttons */
.btn{
  font-size:16px; padding:11px 22px; min-height:46px; border-radius:10px;
  font-weight:500; border:1px solid var(--border); cursor:pointer;
  transition:background-color .15s ease,border-color .15s ease,transform .05s ease;
  display:inline-flex; align-items:center; justify-content:center;
}
.btn:active{transform:scale(0.99);}
.btn-primary{background:var(--accent); color:#fff; border-color:var(--accent);}
.btn-primary:hover{background:var(--accent-hover); border-color:var(--accent-hover);}
.btn-secondary{background:#fff; color:var(--text); border-color:var(--border);}
.btn-secondary:hover{background:var(--surface); border-color:var(--border-strong);}
.btn-block{width:100%;}
.btn-row{display:flex; gap:16px;}
.btn-row .btn{flex:1;}

/* Text input */
input[type="text"]{
  font-size:16px; padding:13px 16px; border-radius:10px;
  border:1.5px solid var(--border); background:var(--surface); color:var(--text);
  width:100%;
}
input[type="text"]:focus{
  outline:none; border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft);
}

/* Progress bar */
.progress-track{height:6px; border-radius:3px; background:var(--surface-alt); overflow:hidden;}
.progress-fill{height:100%; background:var(--accent);}

/* Alerts */
.alert{border-radius:10px; padding:14px 18px; font-size:15px; margin-bottom:16px;}
.alert-warning{background:var(--warning-soft); color:var(--warning); border:1px solid #fde68a;}
.alert-success{background:var(--success-soft); color:var(--success); border:1px solid #bbf7d0;}
.alert-error{background:var(--a-soft); color:var(--a); border:1px solid #fecaca;}

/* Scenario cards */
.scenario-grid{display:grid; grid-template-columns:1fr 1fr; gap:24px;}
.patient-card{border-radius:12px; padding:24px 24px 26px 22px;}
/* While people are stating their own preferences both patients look the same, so colour can't nudge the choice. */
.patient-card.a, .patient-card.b{background:var(--neutral-soft); border-left:4px solid var(--neutral);}
.patient-label{font-weight:700; font-size:15px; letter-spacing:.04em;
  text-transform:uppercase; margin-bottom:24px;}
.patient-label.a, .patient-label.b{color:var(--neutral);}
.feature-row{margin-bottom:18px;}
.feature-name{font-size:14px; color:var(--text-secondary); text-transform:uppercase;
  letter-spacing:.07em; margin-bottom:5px;}
.feature-value{font-size:32px; font-weight:600; font-family:monospace; line-height:1.15;}

/* Score buttons */
.score-row{display:flex; gap:12px;}
.score-btn{flex:1; padding:11px 0; text-align:center;}

/* Rating form */
form.inline{display:contents;}

/* Survey section (shared across all final model pages) */
.sv-section{margin:34px 0 10px;}
.sv-section h3{font-size:1.15rem; margin:0 0 6px;}
.sv-intro{color:var(--text-secondary); font-size:14.5px; line-height:1.6; margin-bottom:16px;}
.sv-item{border:1px solid var(--border); border-radius:12px; padding:18px 20px; margin-bottom:14px; background:#fff;}
.sv-q{font-size:15px; line-height:1.55; margin-bottom:14px;}
.sv-scale{display:flex; align-items:center; gap:10px; flex-wrap:wrap;}
.sv-scale .end{font-size:12.5px; color:var(--text-muted); max-width:110px; line-height:1.3;}
.sv-scale label{display:flex; flex-direction:column; align-items:center; gap:4px; font-size:13px; cursor:pointer; min-width:34px;}
.sv-matrix{width:100%; border-collapse:collapse;}
.sv-matrix td{padding:8px 6px; font-size:13.5px; vertical-align:middle;}
.sv-matrix td.rowlabel{width:46%; color:var(--text); line-height:1.4;}
.sv-matrix tr + tr td{border-top:1px solid var(--border);}
.sv-choices label{display:block; margin:6px 0; font-size:14.5px; cursor:pointer;}
.sv-submit{margin:28px 0 40px;}
</style>
{% block extra_head %}{% endblock %}
</head>
<body>
<div class="wrap">
{% block content %}{% endblock %}
</div>
</body>
</html>
